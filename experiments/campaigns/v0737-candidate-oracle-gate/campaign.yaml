schema_version: chemvector-campaign-0.1
campaign_id: v0737-dual-candidate-oracle-gate
objective: 对已完成的 Candidate Oracle summary 使用修正后的 JSON Pointer 门控
status: active
stable_baseline: v0.7.10
max_trials: 1
max_gpu_hours: 0.1

source_paths:
  - chemvector/experiment_loop
  - tests/chemvector/test_experiment_loop.py

input_artifacts:
  - outputs/experiments/v0737-dual-candidate-oracle/trials/low-threshold-oracle/validation-498/evaluation/summary.json

trials:
  - id: corrected-gate
    hypothesis: t=0.05且最多256候选足以覆盖至少80%的完整真实顶点集合
    stages:
      - id: gate-existing-summary
        command:
          - .venv-train/bin/python
          - -c
          - "print('reuse completed Candidate Oracle summary')"
        result_file: outputs/experiments/v0737-dual-candidate-oracle/trials/low-threshold-oracle/validation-498/evaluation/summary.json
        gates:
          - metric: /configs/t0.05-k256/merged/candidate_recall
            operator: ge
            value: 0.98
          - metric: /configs/t0.05-k256/merged/candidate_oracle_exact
            operator: ge
            value: 0.80
